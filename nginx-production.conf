# ==============================================================================
# ARCHIVO DE CONFIGURACIÓN DE PRODUCCIÓN PARA NGINX (nginx.conf)
# Diseñado para repositorios de Git y guías de referencia de arquitectura
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CONTEXTO GLOBAL Y ARQUITECTURA DE PROCESOS
# NGINX utiliza un proceso Master (gestiona lectura de configs, sockets y workers)
# y varios procesos Worker no bloqueantes (manejan conexiones de clientes).
# ------------------------------------------------------------------------------

# Define el número de procesos worker. Se recomienda 'auto' para coincidir con los núcleos de CPU disponibles.
worker_processes auto;

# Ruta del archivo PID del proceso Master y logs globales del sistema
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

# ------------------------------------------------------------------------------
# 2. CONTEXTO DE EVENTOS (CONCURRENCIA Y RED)
# Manejo del bucle de eventos asíncrono (epoll en Linux).
# ------------------------------------------------------------------------------
events {
    # Número máximo de conexiones simultáneas por cada worker process.
    # Concurrencia Máxima Total = worker_processes x worker_connections.
    worker_connections 8192;

    # Permite que un worker acepte múltiples conexiones pendientes de una sola vez.
    multi_accept on;
}

# ------------------------------------------------------------------------------
# 3. CONTEXTO HTTP (CONFIGURACIÓN DE SERVICIO Y VIRTUAL HOSTS)
# ------------------------------------------------------------------------------
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --------------------------------------------------------------------------
    # 3.1. FORMATO Y REGISTRO DE LOGS
    # --------------------------------------------------------------------------
    log_format custom '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log custom;

    # --------------------------------------------------------------------------
    # 3.2. RENDIMIENTO, TIMEOUTS Y LÍMITES DE RECURSOS
    # --------------------------------------------------------------------------
    # Tiempo máximo de espera para conexiones inactivas antes de ser cerradas (en segundos).
    keepalive_timeout 65;

    # Máximo número de peticiones permitidas por cada conexión keepalive antes de cerrarla.
    keepalive_requests 100;

    # Tamaño máximo permitido para el cuerpo de la petición del cliente (subida de archivos).
    client_max_body_size 10M;

    # --------------------------------------------------------------------------
    # 3.3. CACHÉ DE SESIONES SSL/TLS Y SEGURIDAD GLOBAL
    # Guarda sesiones TLS en memoria compartida para reducir handshakes y uso de CPU.
    # --------------------------------------------------------------------------
    ssl_session_cache shared:SSL:10m;

    # --------------------------------------------------------------------------
    # 3.4. CONTROL DE TASA Y CONEXIONES (PROTECCIÓN CONTRA ABUSOS / DDOS)
    # Define zonas de memoria para limitar conexiones y tasa de peticiones por IP.
    # --------------------------------------------------------------------------
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_req_zone  $binary_remote_addr zone=req_limit_per_ip:10m rate=5r/s;

    # --------------------------------------------------------------------------
    # 3.5. CLÚSTER UPSTREAM (BALANCEO DE CARGA)
    # Define un grupo de servidores backend para distribución de tráfico.
    # --------------------------------------------------------------------------
    upstream backend_cluster {
        # Algoritmo por defecto: Round Robin con pesos y control de fallos
        server backend1.ejemplo.com weight=5;
        server backend2.ejemplo.com max_fails=3 fail_timeout=30s;
        server 192.0.2.50:3000 max_conns=100;
    }

    # --------------------------------------------------------------------------
    # 3.6. SERVIDOR HTTP (PUERTO 80) - REDIRECCIÓN OBLIGATORIA A HTTPS
    # Redirige todo el tráfico no seguro mediante un estado 301 hacia HTTPS.
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name mi-web.com www.mi-web.com;

        return 301 https://$host$request_uri;
    }

    # --------------------------------------------------------------------------
    # 3.7. SERVIDOR HTTPS (PUERTO 443) - VIRTUAL HOST PRINCIPAL CON TLS & SNI
    # Gracias a SNI (Server Name Indication), NGINX sirve certificados según el host.
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name mi-web.com www.mi-web.com;

        # Configuración de Certificados SSL/TLS
        ssl_certificate     /etc/nginx/certs/www.mi-web.com.crt;
        ssl_certificate_key /etc/nginx/certs/www.mi-web.com.key;

        # Protocolos y Cifrados Seguros
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Directorio raíz y archivos índice por defecto
        root /var/www/mi-web.com/html;
        index index.html index.htm;

        # Aplicación de límites por cliente (Devuelve error 503 si se excede)
        limit_conn conn_limit_per_ip 5;
        limit_req zone=req_limit_per_ip burst=10 nodelay;

        # ----------------------------------------------------------------------
        # A. SERVIDO DE CONTENIDO ESTÁTICO Y MANEJO DE 404
        # ----------------------------------------------------------------------
        location / {
            # Intenta servir el archivo directamente, luego como directorio, o da 404
            try_files $uri $uri/ =404;
        }

        # ----------------------------------------------------------------------
        # B. PROXY INVERSO Y BALANCEO DE CARGA A BACKEND
        # ----------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # C. INTEGRACIÓN CON PHP (FastCGI)
        # ----------------------------------------------------------------------
        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # ----------------------------------------------------------------------
        # D. INTEGRACIÓN CON PYTHON (WSGI / uWSGI)
        # ----------------------------------------------------------------------
        location /app-python/ {
            uwsgi_pass unix:///var/run/uwsgi-app.sock;
            include uwsgi_params;
        }

        # ----------------------------------------------------------------------
        # E. INTEGRACIÓN CON JAVA (Tomcat vía HTTP o AJP)
        # ----------------------------------------------------------------------
        # Opción 1 (Estándar HTTP): proxy_pass http://tomcat:8080;
        # Opción 2 (Protocolo binario AJP requiriendo el módulo nginx_ajp_module):
        location /app-java/ {
            ajp_pass 127.0.0.1:8009;
        }

        # ----------------------------------------------------------------------
        # F. RESTRICCIÓN DE ACCESO Y FILTRADO POR IP
        # El orden de reglas importa: NGINX evalúa en orden y para en la 1ª coincidencia.
        # ----------------------------------------------------------------------
        location /admin/ {
            allow 192.168.1.10;
            allow 10.0.0.0/24;
            deny all;
        }

        # ----------------------------------------------------------------------
        # G. AUTENTICACIÓN HTTP BÁSICA
        # ----------------------------------------------------------------------
        location /privado/ {
            auth_basic "Area Restringida";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        # ----------------------------------------------------------------------
        # H. EJEMPLO DE REDIRECCIÓN Y REESCRITURA (REWRITE)
        # ----------------------------------------------------------------------
        # Redirección simple con return (ej. 301 permanente)
        location /old-page {
            return 301 https://mi-web.com/new-page;
        }

        # Reescritura con expresión regular utilizando la directiva rewrite
        # El flag 'permanent' devuelve un código HTTP 301
        location /oldpath/ {
            rewrite ^/oldpath/(.*)$ /newpath/$1 permanent;
        }
    }
}
